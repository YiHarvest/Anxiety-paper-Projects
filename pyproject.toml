[project]
name = "hemozero"
version = "0.2.0"
description = "Derivation-aware multi-view learning for small-sample anxiety classification"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "xgboost>=2.0.0",
    "shap>=0.42.0",
    "seaborn>=0.12.0",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.2",
    "joblib>=1.4.0",
    "networkx>=3.4.0",
    "interpret-core>=0.7.8",
    "mlflow>=3.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
foundation = ["tabpfn>=6.3.1", "torch==2.9.1+cpu"]
symbolic = ["pysr>=1.5.10"]
agent = ["taskweaver @ git+https://github.com/microsoft/TaskWeaver.git@d44ddef23f90059fb17999d3095db4240e98f955"]
distill = ["sparse-transform>=0.2.1"]
knowledge-graph = ["neo4j>=5.26,<7"]

[project.scripts]
hemozero = "hemzero.cli:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["hemzero*", "pi_agent*", "tools*"]

[tool.uv]
index-url = "https://mirrors.aliyun.com/pypi/simple/"
package = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
